<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Entrar — Área do Programa | Regiane Silva</title>
<link rel="stylesheet" href="../../assets/css/style.css" />
<script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>

<canvas id="bg-canvas"></canvas>
<canvas id="grain-canvas"></canvas>
<div class="grid-bg"></div>
<div class="scan-line"></div>
<div class="c-dot" id="cdot"></div>
<div class="c-ring" id="cring"></div>

<div id="loader">
  <div class="loader-mark">Regiane Silva</div>
  <div class="loader-bar-wrap"><div class="loader-bar" id="loader-bar"></div></div>
</div>

<div class="auth-shell">
  <div class="hero-glow" style="top:30%;"></div>
  <div class="auth-card reveal in">
    <div class="auth-logo">
      <div class="lg-name">Regiane Silva</div>
      <span class="lg-sub">Área do Programa</span>
    </div>
    <h1 class="auth-title">Bem-vinda de volta</h1>
    <p class="auth-sub">Entre com sua conta Google para acessar seu acompanhamento, comunidade, aulas e materiais.</p>

    <div class="auth-error" id="auth-error"></div>

    <div id="g_signin_btn" style="display:flex;justify-content:center;"></div>

    <p class="auth-foot" style="margin-top:26px;">Fez apenas o Check-up? <a href="../checkup/login.html">Acesse por aqui</a></p>
    <p class="auth-foot" style="margin-top:6px;"><a href="../index.html">← Voltar para a escolha de área</a></p>
  </div>
</div>

<script src="../../assets/js/api.js"></script>
<script src="../../assets/js/main.js"></script>
<script>
  window.addEventListener('load', function(){
    if(typeof google === 'undefined' || !google.accounts){
      document.getElementById('auth-error').textContent = 'Não foi possível carregar o login do Google. Verifique sua conexão e recarregue a página.';
      document.getElementById('auth-error').classList.add('show');
      return;
    }
    google.accounts.id.initialize({
      client_id: GOOGLE_CLIENT_ID,
      callback: handleGoogleCredential
    });
    google.accounts.id.renderButton(document.getElementById('g_signin_btn'), {
      theme: 'outline', size: 'large', shape: 'pill', text: 'continue_with', width: 300
    });
  });

  async function handleGoogleCredential(response){
    const err = document.getElementById('auth-error');
    err.classList.remove('show');

    if(!apiConfigured()){
      // Backend ainda não publicado: modo demonstração — entra com o e-mail do Google, sem checar cadastro.
      const payload = JSON.parse(atob(response.credential.split('.')[1].replace(/-/g,'+').replace(/_/g,'/')));
      sessionStorage.setItem('rs_programa_email', payload.email);
      sessionStorage.setItem('rs_programa_nome', payload.name || '');
      window.location.href = 'dashboard.html';
      return;
    }

    const result = await apiPost('googleLoginPrograma', { idToken: response.credential });
    if(result.ok){
      sessionStorage.setItem('rs_programa_email', result.email);
      sessionStorage.setItem('rs_programa_nome', result.nome || '');
      window.location.href = 'dashboard.html';
    } else {
      err.textContent = result.error || 'Não foi possível entrar com esta conta Google.';
      err.classList.add('show');
    }
  }
</script>
</body>
</html>
